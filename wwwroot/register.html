<!doctype html>
<html lang="vi">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <link rel="stylesheet" href="fonts/icomoon/style.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    
    <!-- Style -->
    <link rel="stylesheet" href="css/login-style.css">

    <title>Đăng ký - Group 1 Store</title>
    <style>
        #message {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
            display: none;
        }
        #message.show {
            display: block;
        }
        #message.success {
            color: #28a745 !important;
        }
        .forgot-pass {
            text-decoration: none !important;
            color: #667eea !important;
        }
        .forgot-pass:hover {
            color: #764ba2 !important;
            text-decoration: underline !important;
        }
        .auth-switch-link {
            color: #667eea !important;
            text-decoration: none !important;
            font-weight: 600;
        }
        .auth-switch-link:hover {
            color: #764ba2 !important;
            text-decoration: underline !important;
        }
        .btn-primary {
            background-color: #667eea !important;
            border-color: #667eea !important;
        }
        .btn-primary:hover {
            background-color: #764ba2 !important;
            border-color: #764ba2 !important;
        }
        .control input:checked ~ .control__indicator {
            background: #667eea !important;
        }
        .control:hover input:not([disabled]):checked ~ .control__indicator, 
        .control input:checked:focus ~ .control__indicator {
            background: #764ba2 !important;
        }
        .otp-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: end;
        }
        .otp-btn {
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #334155;
            border-radius: 6px;
            padding: 10px 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .otp-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .otp-status {
            margin-top: 6px;
            font-size: 12px;
            color: #475569;
        }
        .otp-section {
            display: none;
        }
        .otp-section.show {
            display: block;
        }
        .otp-status.ok { color: #15803d; }
        .otp-status.err { color: #b91c1c; }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0 14px;
            color: #94a3b8;
            font-size: 13px;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }
        a.btn-google {
            display: flex !important;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            min-height: 54px;
            padding: 12px 24px;
            margin-top: 4px;
            border-radius: 6px;
            background: #dc3545 !important;
            border: 1px solid #c82333 !important;
            color: #fff !important;
            text-decoration: none !important;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.35);
        }
        a.btn-google:hover {
            color: #fff !important;
            text-decoration: none !important;
            filter: brightness(1.06);
        }
    </style>
  </head>
  <body class="login-page">
  
  <div class="d-lg-flex half">
    <div class="bg order-1 order-md-2" style="background-image: url('images/bg_1.jpg');"></div>
    <div class="contents order-2 order-md-1">

      <div class="container">
        <div class="row align-items-center justify-content-center">
          <div class="col-md-7">
            <h3>Đăng ký tài khoản mới</h3>
            <form onsubmit="handleRegister(event)">
              <div class="form-group first">
                <label for="username">Tên đăng nhập *</label>
                <input type="text" class="form-control" placeholder="vd: trang_shop" id="username" required autocomplete="username" pattern="[a-zA-Z0-9_]{3,32}" maxlength="32">
              </div>
              <div class="form-group">
                <label for="displayName">Tên hiển thị</label>
                <input type="text" class="form-control" placeholder="Tên hiển thị trên cửa hàng" id="displayName" maxlength="80" autocomplete="nickname">
              </div>
              <div class="form-group">
                <label for="password">Mật khẩu *</label>
                <input type="password" class="form-control" placeholder="Ít nhất 4 ký tự" id="password" required minlength="4" autocomplete="new-password">
              </div>
              <div class="form-group">
                <label for="confirmPassword">Nhập lại mật khẩu *</label>
                <input type="password" class="form-control" placeholder="Nhập lại mật khẩu" id="confirmPassword" required minlength="4" autocomplete="new-password">
              </div>
              <div class="form-group">
                <label for="phone">Số điện thoại *</label>
                <input type="tel" class="form-control" placeholder="0912345678" id="phone" required autocomplete="tel" maxlength="11">
              </div>
              <div class="form-group last mb-3 otp-section" id="otp-section">
                <label for="otpCode">Mã OTP *</label>
                <div class="otp-row">
                    <input type="text" class="form-control" placeholder="Nhập 6 số" id="otpCode" maxlength="6" pattern="[0-9]{6}">
                    <button type="button" class="otp-btn" id="btn-verify-otp" onclick="verifyRegisterOtp()">Xác thực OTP</button>
                </div>
                <p id="otp-status" class="otp-status"></p>
              </div>
              
              <div class="d-flex mb-5 align-items-center">
                <span class="ml-auto"><a href="index.html" class="forgot-pass">Về trang chủ</a></span> 
              </div>

              <input type="submit" value="Tạo tài khoản" class="btn btn-block btn-primary" id="btn-register">

              <div class="auth-divider">hoặc</div>

              <a href="/Account/GoogleLogin" class="btn-google" title="Đăng ký / đăng nhập bằng Google">
                <i class="fa-brands fa-google"></i> Đăng ký bằng Google
              </a>

              <p id="message"></p>

              <div class="text-center mt-4">
                Đã có tài khoản? <a href="login.html" class="auth-switch-link">Đăng nhập ngay</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
    
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="js/profile.js"></script>
    <script>
        var verifiedOtpToken = null;
        var verifiedPhone = null;
        var otpExpireAtMs = 0;
        var otpTimer = null;
        var latestDemoOtpCode = '';

        function normalizePhone(raw) {
            var digits = String(raw || '').replace(/\D/g, '');
            if (digits.startsWith('84') && digits.length >= 11) digits = '0' + digits.slice(2);
            return digits;
        }

        function setOtpStatus(text, isError) {
            var el = document.getElementById('otp-status');
            if (!el) return;
            el.textContent = text || '';
            el.className = 'otp-status' + (text ? (isError ? ' err' : ' ok') : '');
        }

        function toggleOtpSection(visible) {
            var section = document.getElementById('otp-section');
            if (!section) return;
            section.classList.toggle('show', !!visible);
        }

        function updateOtpCountdown() {
            if (!otpExpireAtMs) return;
            var remainMs = otpExpireAtMs - Date.now();
            if (remainMs <= 0) {
                otpExpireAtMs = 0;
                clearInterval(otpTimer);
                otpTimer = null;
                latestDemoOtpCode = '';
                setOtpStatus('OTP đã hết hạn. Vui lòng gửi lại.', true);
                return;
            }
            var sec = Math.floor(remainMs / 1000);
            var countdownText = 'OTP còn hiệu lực: ' + Math.floor(sec / 60) + 'm ' + (sec % 60) + 's';
            if (latestDemoOtpCode) {
                countdownText = 'Mã OTP demo: ' + latestDemoOtpCode + ' | ' + countdownText;
            }
            setOtpStatus(countdownText, false);
        }

        async function sendRegisterOtp() {
            var username = document.getElementById('username').value.trim();
            var displayName = document.getElementById('displayName').value.trim();
            var password = document.getElementById('password').value;
            var confirm = document.getElementById('confirmPassword').value;
            var phone = normalizePhone(document.getElementById('phone').value);

            if (!username || !displayName || !password || !confirm) {
                setOtpStatus('Nhập đủ tên hiển thị và mật khẩu trước khi gửi OTP.', true);
                return;
            }
            if (password.length < 4) {
                setOtpStatus('Mật khẩu phải có ít nhất 4 ký tự.', true);
                return;
            }
            if (password !== confirm) {
                setOtpStatus('Mật khẩu xác nhận không khớp.', true);
                return;
            }
            if (!/^0\d{9}$/.test(phone)) {
                setOtpStatus('Số điện thoại không hợp lệ (10 số, bắt đầu bằng 0).', true);
                return;
            }
            try {
                toggleOtpSection(true);
                var res = await apiPost(API_ENDPOINTS.REGISTER_SEND_OTP, { phone: phone });
                verifiedOtpToken = null;
                verifiedPhone = null;
                document.getElementById('otpCode').value = '';
                latestDemoOtpCode = '';
                otpExpireAtMs = Date.now() + ((res && res.expiresInSeconds ? res.expiresInSeconds : 300) * 1000);
                if (otpTimer) clearInterval(otpTimer);
                if (res && res.demoCode) {
                    latestDemoOtpCode = String(res.demoCode);
                }
                otpTimer = setInterval(updateOtpCountdown, 1000);
                updateOtpCountdown();
                if (!latestDemoOtpCode) {
                    setOtpStatus('Đã gửi OTP. Vui lòng nhập mã để xác thực.', false);
                }
                return true;
            } catch (e) {
                setOtpStatus(e.message || 'Không gửi được OTP.', true);
                return false;
            }
        }

        async function verifyRegisterOtp() {
            var phone = normalizePhone(document.getElementById('phone').value);
            var code = (document.getElementById('otpCode').value || '').trim();
            if (!/^0\d{9}$/.test(phone)) {
                setOtpStatus('Số điện thoại không hợp lệ.', true);
                return;
            }
            if (!/^\d{6}$/.test(code)) {
                setOtpStatus('Mã OTP phải gồm 6 số.', true);
                return;
            }
            var btn = document.getElementById('btn-verify-otp');
            btn.disabled = true;
            try {
                var res = await apiPost(API_ENDPOINTS.REGISTER_VERIFY_OTP, { phone: phone, code: code });
                verifiedOtpToken = res.otpToken;
                verifiedPhone = phone;
                setOtpStatus('Xác thực số điện thoại thành công.', false);
            } catch (e) {
                verifiedOtpToken = null;
                verifiedPhone = null;
                setOtpStatus(e.message || 'Xác thực OTP thất bại.', true);
            } finally {
                btn.disabled = false;
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            var msg = document.getElementById('message');
            var btn = document.getElementById('btn-register');

            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var confirm = document.getElementById('confirmPassword').value;
            var displayName = document.getElementById('displayName').value.trim();
            var phone = normalizePhone(document.getElementById('phone').value);

            msg.classList.remove('show', 'success');

            if (password !== confirm) {
                msg.textContent = 'Mật khẩu xác nhận không khớp.';
                msg.classList.add('show');
                return;
            }
            if (!/^0\d{9}$/.test(phone)) {
                msg.textContent = 'Số điện thoại không hợp lệ (10 số, bắt đầu bằng 0).';
                msg.classList.add('show');
                return;
            }
            if (!verifiedOtpToken || verifiedPhone !== phone) {
                var sent = await sendRegisterOtp();
                if (sent) {
                    msg.textContent = 'Đã gửi mã OTP. Vui lòng xác thực OTP rồi bấm tạo tài khoản lại.';
                    msg.classList.add('show');
                } else {
                    msg.textContent = 'Không gửi được OTP. Vui lòng thử lại.';
                    msg.classList.add('show');
                }
                return;
            }

            btn.disabled = true;
            try {
                var data = await apiPost(API_ENDPOINTS.REGISTER, {
                    username: username,
                    password: password,
                    confirmPassword: confirm,
                    displayName: displayName || username,
                    phone: phone,
                    otpToken: verifiedOtpToken
                });

                localStorage.setItem('userToken', data.token);
                saveProfileToLocalStorage({
                    username: data.username || username,
                    displayName: data.displayName || displayName || username,
                    avatarUrl: data.avatarUrl,
                    backgroundUrl: data.backgroundUrl
                });

                msg.classList.remove('show', 'success');
                if (window.AppNotify && typeof window.AppNotify.success === 'function') {
                    window.AppNotify.success('Đăng ký thành công! Đang chuyển trang...');
                } else {
                    msg.textContent = 'Đăng ký thành công! Đang chuyển đến khu vực cá nhân...';
                    msg.classList.add('show', 'success');
                }
                setTimeout(function () {
                    window.location.href = 'account.html';
                }, 600);
            } catch (e) {
                msg.textContent = e.message || 'Đăng ký thất bại.';
                msg.classList.add('show');
            } finally {
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            toggleOtpSection(false);
        });
    </script>
  </body>
</html>
