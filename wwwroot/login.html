<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập / Đăng ký - Group 1 Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/header-footer.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Chuyển đổi Tab */
        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-weight: 600;
            color: #aaa;
            transition: 0.3s;
        }

            .auth-tab.active {
                color: #667eea;
                border-bottom: 2px solid #667eea;
            }

        .auth-form {
            display: none;
        }

            .auth-form.active {
                display: block;
                animation: fadeIn 0.4s ease;
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                color: #555;
                font-weight: 600;
            }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }

            input:focus {
                outline: none;
                border-color: #667eea;
                box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
            }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s;
            margin-top: 10px;
        }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            }

        #message {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
            display: none;
        }

            #message.show {
                display: block;
            }

        .login-hint {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

            .back-link a {
                color: #667eea;
                text-decoration: none;
                font-weight: 600;
                transition: 0.3s;
            }

                .back-link a:hover {
                    color: #764ba2;
                }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo" onclick="navigateToHome()" style="cursor: pointer;">
                <i class="fa-solid fa-store"></i> Group <span>1 Store</span>
            </div>
            <div class="header-right">
                <button class="user-btn" onclick="navigateToHome()">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại
                </button>
            </div>
        </div>
    </header>

    <div class="main-content">
        <div class="login-card">

            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('login')">Đăng Nhập</div>
                <div class="auth-tab" onclick="switchTab('register')">Đăng Ký</div>
            </div>

            <div id="login-form" class="auth-form active">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" placeholder="Nhập tên đăng nhập">
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu">
                </div>
                <button onclick="handleLogin()">
                    <i class="fa-solid fa-sign-in-alt"></i> Đăng Nhập
                </button>
            </div>

            <div id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="reg-username">Tên đăng nhập mới</label>
                    <input type="text" id="reg-username" placeholder="Tạo tên đăng nhập (VD: student123)">
                </div>
                <div class="form-group">
                    <label for="reg-password">Mật khẩu</label>
                    <input type="password" id="reg-password" placeholder="Tạo mật khẩu">
                </div>
                <div class="form-group">
                    <label for="reg-confirm">Xác nhận mật khẩu</label>
                    <input type="password" id="reg-confirm" placeholder="Nhập lại mật khẩu">
                </div>
                <button onclick="handleRegister()">
                    <i class="fa-solid fa-user-plus"></i> Tạo Tài Khoản
                </button>
            </div>

            <p id="message"></p>

            <div class="login-hint">
                <strong>Tài khoản có sẵn để test:</strong><br>
                <code>admin</code> · <code>khach</code> · <code>user</code> (mật khẩu: <code>123456</code>)
            </div>

            <div class="back-link">
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Về trang chủ</a>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="js/header.js"></script>
    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.getElementById('message').classList.remove('show');

            if (tabName === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        async function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('message');

            if (!user || !pass) {
                msg.textContent = "Vui lòng nhập đầy đủ thông tin!";
                msg.classList.add('show');
                return;
            }

            try {
                const data = await apiPost(API_ENDPOINTS.LOGIN, { username: user, password: pass });
                localStorage.setItem('userToken', data.token);
                if (data.avatarUrl) localStorage.setItem('userAvatar', data.avatarUrl);
                localStorage.setItem('userName', data.username || user);

                msg.classList.remove('show');
                alert("Đăng nhập thành công! Đang chuyển hướng...");
                window.location.href = "account.html";
            } catch (error) {
                msg.textContent = "Tài khoản hoặc mật khẩu không đúng!";
                msg.classList.add('show');
            }
        }

        async function handleRegister() {
            const user = document.getElementById('reg-username').value.trim();
            const pass = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            const msg = document.getElementById('message');

            if (!user || !pass || !confirm) {
                msg.textContent = "Vui lòng nhập đầy đủ thông tin!";
                msg.classList.add('show');
                return;
            }
            if (pass !== confirm) {
                msg.textContent = "Mật khẩu xác nhận không khớp!";
                msg.classList.add('show');
                return;
            }

            try {
                // Gọi tới endpoint register chúng ta đã cấu hình trong AuthController
                await apiPost(`${API_BASE_URL}/auth/register`, { username: user, password: pass });

                alert("Đăng ký thành công! Vui lòng đăng nhập với tài khoản vừa tạo.");
                switchTab('login');
                document.getElementById('username').value = user;
                document.getElementById('password').value = '';
                document.getElementById('reg-username').value = '';
                document.getElementById('reg-password').value = '';
                document.getElementById('reg-confirm').value = '';
            } catch (error) {
                msg.textContent = "Đăng ký thất bại: Tên đăng nhập này có thể đã tồn tại.";
                msg.classList.add('show');
            }
        }

        // Hỗ trợ nhấn Enter
        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('reg-confirm').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleRegister();
        });
    </script>
</body>
</html>
