<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - Group 1 Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Header/Footer CSS -->
    <link rel="stylesheet" href="css/header-footer.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7fb;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            max-width: 1000px;
            margin: 30px auto;
            width: 100%;
        }

        .page-title {
            font-size: 32px;
            color: #111827;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cart-content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #eee;
            gap: 20px;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .item-price {
            color: #00a8cc;
            font-size: 16px;
            font-weight: 600;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-input {
            width: 60px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
        }

        .btn-update {
            background: #28a745;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-update:hover {
            background: #218838;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .cart-summary {
            margin-top: 30px;
            text-align: right;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .summary-total {
            font-size: 20px;
            font-weight: 700;
            color: #00a8cc;
            margin-bottom: 20px;
        }

        .btn-checkout {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
            margin-right: 15px;
        }

        .btn-checkout:hover {
            transform: scale(1.05);
        }

        .btn-continue {
            background: #6c757d;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-continue:hover {
            background: #5a6268;
        }

        .empty-message {
            text-align: center;
            padding: 60px 40px;
            color: #666;
            font-size: 18px;
        }

        .empty-message a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
        }

        .empty-message a:hover {
            text-decoration: underline;
        }

        @media(max-width: 768px) {
            .cart-item {
                flex-wrap: wrap;
                gap: 15px;
            }

            .item-controls {
                width: 100%;
                flex-wrap: wrap;
            }

            .btn-checkout, .btn-continue {
                width: 100%;
            }

            .page-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo" onclick="navigateToHome()" title="Trang chủ" style="cursor: pointer;">
                <i class="fa-solid fa-store"></i> Group <span>1 Store</span>
            </div>

            <button class="menu-toggle">
                <i class="fa-solid fa-bars"></i>
            </button>

            <nav class="nav-menu">
                <a href="index.html">
                    <i class="fa-solid fa-home"></i> Trang chủ
                </a>
                <a href="index.html#products">
                    <i class="fa-solid fa-box"></i> Sản phẩm
                </a>
            </nav>

            <div class="header-right">
                <button class="cart-icon" style="background: #00d4ff; color: #111827;">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-count">0</span>
                </button>

                <div class="user-menu">
                    <button class="user-btn" id="user-btn" style="display: none;" title="Tài khoản">
                        <i class="fa-solid fa-user"></i> Tài khoản
                    </button>
                    <div class="dropdown-menu" id="user-dropdown">
                        <a href="#" onclick="logout(); return false;">
                            <i class="fa-solid fa-sign-out-alt"></i> Đăng xuất
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="main-content">
        <h1 class="page-title">
            <i class="fa-solid fa-cart-shopping"></i> Giỏ hàng của tôi
        </h1>

        <div class="cart-content">
            <div id="cart-items"></div>
            <div id="cart-summary"></div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-container">
            <div class="footer-bottom" style="border-top: 1px solid rgba(255,255,255,0.1);">
                <p>&copy; 2026 Group 1 Store. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="js/header.js"></script>
    <script>
        let cartData = [];

        window.onload = function() {
            loadMyCart();
        };

        async function loadMyCart() {
            if (!checkAuth()) return;

            try {
                cartData = await apiGet(API_ENDPOINTS.CART);
                displayCart(cartData);
            } catch (error) {
                console.error("Lỗi tải giỏ hàng:", error);
                document.getElementById('cart-items').innerHTML = '<p class="empty-message">Lỗi khi tải giỏ hàng</p>';
            }
        }

        function displayCart(items) {
            const container = document.getElementById('cart-items');
            const summaryContainer = document.getElementById('cart-summary');

            if (!items || items.length === 0) {
                container.innerHTML = '<p class="empty-message"><i class="fa-solid fa-inbox"></i><br>Giỏ hàng trống!<br><a href="index.html">Tiếp tục mua sắm</a></p>';
                summaryContainer.innerHTML = '';
                return;
            }

            let html = '';
            let total = 0;

            items.forEach(item => {
                const itemTotal = item.product.price * item.quantity;
                total += itemTotal;

                html += `
                    <div class="cart-item">
                        <div class="item-info">
                            <div class="item-name">${item.product.name}</div>
                            <div class="item-price">${item.product.price.toLocaleString()} VNĐ</div>
                        </div>
                        <div class="item-controls">
                            <input type="number" class="qty-input" value="${item.quantity}" id="qty-${item.id}" min="1">
                            <button class="btn-update" onclick="updateQuantity(${item.id})">Cập nhật</button>
                            <button class="btn-delete" onclick="removeFromCart(${item.id})">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            summaryContainer.innerHTML = `
                <div class="cart-summary">
                    <div class="summary-total">Tổng cộng: ${total.toLocaleString()} VNĐ</div>
                    <button class="btn-checkout" onclick="checkout()">
                        <i class="fa-solid fa-credit-card"></i> Thanh Toán
                    </button>
                    <button class="btn-continue" onclick="navigateToHome()">
                        <i class="fa-solid fa-arrow-left"></i> Tiếp tục mua sắm
                    </button>
                </div>
            `;
        }

        async function updateQuantity(cartItemId) {
            try {
                const newQty = parseInt(document.getElementById(`qty-${cartItemId}`).value);
                if (newQty < 1) {
                    alert("Số lượng phải >= 1");
                    return;
                }

                await apiPut(`${API_ENDPOINTS.CART}/update/${cartItemId}`, { newQuantity: newQty });
                alert("Cập nhật thành công!");
                loadMyCart();
            } catch (error) {
                alert("Lỗi cập nhật: " + error.message);
            }
        }

        async function removeFromCart(cartItemId) {
            if (!confirm("Bạn chắc chắn muốn xóa sản phẩm này?")) return;

            try {
                await apiDelete(`${API_ENDPOINTS.CART}/${cartItemId}`);
                alert("Xóa thành công!");
                loadMyCart();
            } catch (error) {
                alert("Lỗi xóa: " + error.message);
            }
        }

        function checkout() {
            alert("Chức năng thanh toán sẽ được cập nhật sớm!");
        }
    </script>
</body>
</html>
