<!DOCTYPE html>
<html>
<head>
    <title>Quản lý sản phẩm</title>
    <style>
        .form-container {
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        input, textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Thêm Sản Phẩm Mới</h2>
        <input type="text" id="name" placeholder="Tên sản phẩm">
        <textarea id="description" placeholder="Mô tả"></textarea>
        <input type="number" id="price" placeholder="Giá tiền">
        <input type="number" id="stock" placeholder="Số lượng trong kho">
        <input type="text" id="imageUrl" placeholder="Link ảnh (URL)">
        <button onclick="saveProduct()">Lưu sản phẩm</button>
    </div>

    <script>
        async function saveProduct() {
            const product = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value),
                stock: parseInt(document.getElementById('stock').value),
                imageUrl: document.getElementById('imageUrl').value,
                categoryId: 1 // Gán tạm loại 1
            };

            const response = await fetch('https://localhost:7181/api/Products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(product)
            });

            if (response.ok) {
                alert("Thêm thành công!");
                window.location.href = "index.html"; // Quay lại trang chủ xem hàng
            } else {
                alert("Có lỗi xảy ra!");
            }
        }
    </script>
</body>
</html>
