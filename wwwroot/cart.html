<!DOCTYPE html>
<html>
<head>
    <title>Giỏ hàng của tôi</title>
</head>
<body>
    <h1>Giỏ hàng</h1>
    <div id="cart-content">正在 tải dữ liệu...</div>

    <script>
        // 1. Hàm này sẽ tự động chạy khi bạn mở trang
        window.onload = function() {
            loadMyCart();
        };

        async function loadMyCart() {
            // --- VỊ TRÍ DÁN 1: Lấy Token từ "ngăn kéo" LocalStorage ---
            const token = localStorage.getItem('userToken');

            if (!token) {
                alert("Bạn chưa đăng nhập!");
                window.location.href = "login.html";
                return;
            }

            try {
                // --- VỊ TRÍ DÁN 2: Dán Token vào Header của lệnh Fetch ---
                const response = await fetch('https://localhost:7xxx/api/cart', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`, // DÁN TOKEN VÀO ĐÂY
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    displayCart(data);
                } else {
                    console.log("Lỗi lấy giỏ hàng");
                }
            } catch (error) {
                console.error("Lỗi kết nối:", error);
            }
        }

        function displayCart(items) {
            const container = document.getElementById('cart-content');
            if (items.length === 0) {
                container.innerHTML = "Giỏ hàng trống!";
                return;
            }
            // Logic hiển thị danh sách ra màn hình...
            container.innerHTML = JSON.stringify(items);
        }
    </script>
</body>
</html>
