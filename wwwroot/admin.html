<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - Group 1 Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Header/Footer CSS -->
    <link rel="stylesheet" href="css/header-footer.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7fb;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            max-width: 600px;
            margin: 30px auto;
            width: 100%;
        }

        .page-title {
            font-size: 32px;
            color: #111827;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 5px rgba(0, 212, 255, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            margin-top: 10px;
        }

        button:hover {
            transform: scale(1.02);
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #28a745;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #dc3545;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #00d4ff;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #0099cc;
            text-decoration: underline;
        }

        @media(max-width: 768px) {
            .page-title {
                font-size: 24px;
            }

            .form-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo" onclick="navigateToHome()" title="Trang chủ" style="cursor: pointer;">
                <i class="fa-solid fa-store"></i> Group <span>1 Store</span>
            </div>

            <button class="menu-toggle">
                <i class="fa-solid fa-bars"></i>
            </button>

            <nav class="nav-menu">
                <a href="index.html">
                    <i class="fa-solid fa-home"></i> Trang chủ
                </a>
            </nav>

            <div class="header-right">
                <button class="user-btn" id="user-btn" style="display: none;" title="Tài khoản">
                    <i class="fa-solid fa-user"></i> Tài khoản
                </button>
                <div class="dropdown-menu" id="user-dropdown">
                    <a href="#" onclick="logout(); return false;">
                        <i class="fa-solid fa-sign-out-alt"></i> Đăng xuất
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="main-content">
        <h1 class="page-title">
            <i class="fa-solid fa-plus-circle"></i> Thêm Sản Phẩm Mới
        </h1>

        <div class="form-container">
            <div id="success-message" class="success">
                <i class="fa-solid fa-check"></i> Thêm sản phẩm thành công!
            </div>

            <div id="error-message" class="error">
                <i class="fa-solid fa-exclamation"></i> <span id="error-text"></span>
            </div>

            <div class="form-group">
                <label for="name">Tên sản phẩm *</label>
                <input type="text" id="name" placeholder="Nhập tên sản phẩm" required>
            </div>

            <div class="form-group">
                <label for="description">Mô tả *</label>
                <textarea id="description" placeholder="Nhập mô tả sản phẩm" required></textarea>
            </div>

            <div class="form-group">
                <label for="price">Giá tiền (VNĐ) *</label>
                <input type="number" id="price" placeholder="Nhập giá tiền" min="0" step="1000" required>
            </div>

            <div class="form-group">
                <label for="stock">Số lượng trong kho *</label>
                <input type="number" id="stock" placeholder="Nhập số lượng" min="0" required>
            </div>

            <div class="form-group">
                <label for="imageUrl">Link ảnh (URL) *</label>
                <input type="text" id="imageUrl" placeholder="https://example.com/image.jpg" required>
            </div>

            <div class="form-group">
                <label for="categoryId">Danh mục (ID)</label>
                <input type="number" id="categoryId" placeholder="ID danh mục (mặc định: 1)" value="1" min="1">
            </div>

            <button onclick="saveProduct()">
                <i class="fa-solid fa-save"></i> Lưu sản phẩm
            </button>

            <a href="index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ
            </a>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-container">
            <div class="footer-bottom" style="border-top: 1px solid rgba(255,255,255,0.1);">
                <p>&copy; 2026 Group 1 Store. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="js/header.js"></script>
    <script>
        function saveLocalProduct(product) {
            const saved = JSON.parse(localStorage.getItem('savedProducts') || '[]');
            const filtered = saved.filter(item => item.id !== product.id);
            filtered.unshift(product);
            localStorage.setItem('savedProducts', JSON.stringify(filtered));
        }

        async function saveProduct() {
            const successMsg = document.getElementById('success-message');
            const errorMsg = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');

            // Hide messages
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';

            // Validate input
            const name = document.getElementById('name').value.trim();
            const description = document.getElementById('description').value.trim();
            const price = parseFloat(document.getElementById('price').value);
            const stock = parseInt(document.getElementById('stock').value);
            const imageUrl = document.getElementById('imageUrl').value.trim();
            const categoryId = parseInt(document.getElementById('categoryId').value) || 1;

            if (!name || !description || !price || isNaN(stock) || !imageUrl) {
                errorText.textContent = "Vui lòng điền đầy đủ các trường bắt buộc!";
                errorMsg.style.display = 'block';
                return;
            }

            // Kiểm tra giá
            if (price < 0) {
                errorText.textContent = "Giá tiền không được âm!";
                errorMsg.style.display = 'block';
                return;
            }

            // Kiểm tra stock
            if (stock < 0) {
                errorText.textContent = "Số lượng không được âm!";
                errorMsg.style.display = 'block';
                return;
            }

            const product = {
                name: name,
                description: description,
                price: price,
                stock: stock,
                imageUrl: imageUrl,
                categoryId: categoryId
            };

            try {
                const result = await apiPost(API_ENDPOINTS.PRODUCTS, product);
                
                successMsg.style.display = 'block';
                console.log("Sản phẩm đã được thêm:", result);

                // Clear form
                document.getElementById('name').value = '';
                document.getElementById('description').value = '';
                document.getElementById('price').value = '';
                document.getElementById('stock').value = '';
                document.getElementById('imageUrl').value = '';
                document.getElementById('categoryId').value = '1';

                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = "index.html?new=1";
                }, 2000);
            } catch (error) {
                console.error("Lỗi khi thêm sản phẩm:", error);
                errorText.textContent = "Có lỗi xảy ra: " + error.message;
                errorMsg.style.display = 'block';
            }
        }

        // Initialize page
        window.addEventListener('load', function() {
            initializeHeader();
        });
    </script>
</body>
</html>
