<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 100px;
            background: #f4f4f4;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 350px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }

            button:hover {
                background: #218838;
            }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Đăng Nhập</h2>
        <input type="text" id="username" placeholder="Tên đăng nhập (admin)">
        <input type="password" id="password" placeholder="Mật khẩu (123456)">
        <button onclick="handleLogin()">Đăng nhập</button>
        <p id="message" style="color: red;"></p>
    </div>

    <script>
        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('message');

            try {
                // Thay cổng 7xxx bằng cổng thực tế của API bạn (Xem trên thanh địa chỉ khi chạy API)
                const response = await fetch('https://localhost:7xxx/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                if (response.ok) {
                    const data = await response.json();
                    // Lưu Token vào "ngăn kéo" trình duyệt
                    localStorage.setItem('userToken', data.token);
                    alert("Đăng nhập thành công! Đang chuyển hướng...");
                    window.location.href = "index.html";
                } else {
                    msg.innerText = "Tài khoản hoặc mật khẩu không đúng!";
                }
            } catch (error) {
                msg.innerText = "Lỗi kết nối tới Server!";
            }
        }
    </script>
    <div class="login-box">
        <input type="text" id="username" />
        <input type="password" id="password" />
        <button onclick="handleLogin()">Đăng nhập</button>
    </div>

    <script>
        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const response = await fetch('https://localhost:7xxx/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });

            if (response.ok) {
                const data = await response.json();
                // Lệnh quan trọng nhất để lưu Token vào trình duyệt
                localStorage.setItem('userToken', data.token);
                alert("Đã lấy và lưu Token thành công!");
                window.location.href = "index.html";
            } else {
                alert("Đăng nhập thất bại!");
            }
        }
    </script>
</body>
</html>
</body>
</html>
