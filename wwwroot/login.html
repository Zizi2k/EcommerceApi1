<!doctype html>
<html lang="vi">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <link rel="stylesheet" href="fonts/icomoon/style.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    
    <!-- Style -->
    <link rel="stylesheet" href="css/login-style.css">

    <title>Đăng nhập - Group 1 Store</title>
    <style>
        #message {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
            display: none;
        }
        #message.show {
            display: block;
        }
        .forgot-pass {
            text-decoration: none !important;
            color: #667eea !important;
        }
        .forgot-pass:hover {
            color: #764ba2 !important;
            text-decoration: underline !important;
        }
        .auth-switch-link {
            color: #667eea !important;
            text-decoration: none !important;
            font-weight: 600;
        }
        .auth-switch-link:hover {
            color: #764ba2 !important;
            text-decoration: underline !important;
        }
        .btn-primary {
            background-color: #667eea !important;
            border-color: #667eea !important;
        }
        .btn-primary:hover {
            background-color: #764ba2 !important;
            border-color: #764ba2 !important;
        }
        .control input:checked ~ .control__indicator {
            background: #667eea !important;
        }
        .control:hover input:not([disabled]):checked ~ .control__indicator, 
        .control input:checked:focus ~ .control__indicator {
            background: #764ba2 !important;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0 14px;
            color: #94a3b8;
            font-size: 13px;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }
        a.btn-google {
            display: flex !important;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            min-height: 54px;
            padding: 12px 24px;
            margin-top: 12px;
            border-radius: 6px;
            background: #dc3545 !important;
            border: 1px solid #c82333 !important;
            color: #fff !important;
            text-decoration: none !important;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.35);
            transition: filter 0.2s, transform 0.15s;
        }
        a.btn-google:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
            color: #fff !important;
            text-decoration: none !important;
        }
    </style>
  </head>
  <body class="login-page">
  
  <div class="d-lg-flex half">
    <div class="bg order-1 order-md-2" style="background-image: url('images/bg_1.jpg');"></div>
    <div class="contents order-2 order-md-1">

      <div class="container">
        <div class="row align-items-center justify-content-center">
          <div class="col-md-7">
            <h3>Đăng nhập vào <strong>Group 1 Store</strong></h3>
            <p class="mb-4">Chào mừng bạn quay trở lại! Vui lòng điền thông tin bên dưới để đăng nhập.</p>
            <form onsubmit="event.preventDefault(); handleLogin();">
              <div class="form-group first">
                <label for="username">Tên đăng nhập</label>
                <input type="text" class="form-control" placeholder="Nhập tên đăng nhập" id="username">
              </div>
              <div class="form-group last mb-3">
                <label for="password">Mật khẩu</label>
                <input type="password" class="form-control" placeholder="Nhập mật khẩu" id="password">
              </div>
              
              <div class="d-flex mb-5 align-items-center">
                <label class="control control--checkbox mb-0"><span class="caption">Ghi nhớ đăng nhập</span>
                  <input type="checkbox" checked="checked"/>
                  <div class="control__indicator"></div>
                </label>
                <span class="ml-auto"><a href="index.html" class="forgot-pass">Về trang chủ</a></span> 
              </div>

              <input type="submit" value="Đăng Nhập" class="btn btn-block btn-primary">

              <div class="auth-divider">hoặc</div>

              <a href="/Account/GoogleLogin" class="btn-google" title="Đăng nhập bằng tài khoản Google">
                <i class="fa-brands fa-google"></i> Đăng nhập bằng Google
              </a>

              <p id="message"></p>

              <div class="text-center mt-4">
                Chưa có tài khoản? <a href="register.html" class="auth-switch-link">Đăng ký ngay</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
    
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/header.js"></script>
    <script>
        (function () {
            var err = new URLSearchParams(window.location.search).get('error');
            if (err === 'google_not_configured') {
                var msg = document.getElementById('message');
                msg.textContent = 'Đăng nhập Google chưa được cấu hình. Thêm ClientId/ClientSecret vào appsettings.Development.json rồi khởi động lại API.';
                msg.classList.add('show');
            }
        })();

        async function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('message');

            if (!user || !pass) {
                msg.textContent = "Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu!";
                msg.classList.add('show');
                return;
            }

            try {
                const data = await apiPost(API_ENDPOINTS.LOGIN, {
                    username: user,
                    password: pass
                });

                localStorage.setItem('userToken', data.token);
                saveProfileToLocalStorage({
                    username: data.username || user,
                    displayName: data.displayName || data.username || user,
                    avatarUrl: data.avatarUrl,
                    backgroundUrl: data.backgroundUrl
                });
                msg.classList.remove('show');
                alert("Đăng nhập thành công! Đang chuyển đến khu vực cá nhân...");
                window.location.href = "account.html";
            } catch (error) {
                msg.textContent = error.message || "Tài khoản hoặc mật khẩu không đúng!";
                msg.classList.add('show');
            }
        }
    </script>
  </body>
</html>
